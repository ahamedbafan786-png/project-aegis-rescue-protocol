name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code linter
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Run production build
        run: npm run build

  browser-smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --host 0.0.0.0 --port 4173 &
          node -e "const net=require('net'); let retries=40; const test=()=>{ const s=net.connect(4173, '127.0.0.1', ()=>{ console.log('Preview server ready'); s.end(); process.exit(0); }); s.on('error', ()=>{ if(--retries<=0){ console.error('Timeout waiting for preview server'); process.exit(1); } setTimeout(test, 250); }); }; test();"

      - name: Run browser smoke assertions
        run: node scripts/qaSmokeCI.mjs http://127.0.0.1:4173/
